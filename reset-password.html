<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fitisamust | Reset Password</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,700;0,900&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .reset-box {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.02);
            padding: 40px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
</head>
<body>
    <div class="reset-box login-form">
        <h2 style="margin-bottom: 10px;">Set New Password</h2>
        <p class="section-subtitle" style="margin-bottom: 25px;">Enter your new password below.</p>
        
        <form id="reset-form">
            <div class="input-group">
                <label>New Password</label>
                <input type="password" id="new-password" required minlength="6">
            </div>
            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirm-password" required minlength="6">
            </div>
            
            <div id="reset-error" style="color: #ef4444; margin-bottom: 15px; display: none; font-size: 0.9rem;"></div>
            <div id="reset-success" style="color: #10b981; margin-bottom: 15px; display: none; font-size: 0.9rem;"></div>
            
            <button type="submit" class="btn btn-primary w-100" id="reset-btn">Update Password</button>
        </form>
        <div style="margin-top: 20px; text-align: center;">
            <a href="index.html" style="color: var(--accent-light); font-size: 0.9rem;">Return to Login</a>
        </div>
    </div>

    <script>
        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token');
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const errorEl = document.getElementById('reset-error');
            const successEl = document.getElementById('reset-success');
            const btn = document.getElementById('reset-btn');
            
            errorEl.style.display = 'none';
            successEl.style.display = 'none';
            
            if (!token) {
                errorEl.innerText = 'No reset token provided in URL.';
                errorEl.style.display = 'block';
                return;
            }
            
            if (newPassword !== confirmPassword) {
                errorEl.innerText = 'Passwords do not match.';
                errorEl.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.innerText = 'Updating...';
            
            try {
                const res = await fetch((typeof getApiUrl === 'function' ? getApiUrl('/api/reset-password') : '/api/reset-password'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, newPassword })
                });
                
                const text = await res.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    const cleanText = text.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
                    const snippet = cleanText ? cleanText.substring(0, 100) : 'Invalid server response';
                    throw new Error(`Server returned error (${res.status}): ${snippet}`);
                }
                
                if (!res.ok) throw new Error(data.error || 'Failed to reset password');
                
                successEl.innerText = data.message;
                successEl.style.display = 'block';
                document.getElementById('reset-form').reset();
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 3000);
            } catch (err) {
                errorEl.innerText = err.message;
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Update Password';
            }
        });
    </script>
</body>
</html>
